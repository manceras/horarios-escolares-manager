name: Feature request
description: Suggest a capability, or a constraint the solver should understand
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What does a school need that the app cannot do today?
    validations:
      required: true
  - type: textarea
    id: rule
    attributes:
      label: The rule, precisely
      description: >
        If this is a scheduling rule, state it exactly, and say whether breaking it
        makes a timetable invalid (hard) or merely worse (soft).
  - type: textarea
    id: alternatives
    attributes:
      label: How schools work around it today
